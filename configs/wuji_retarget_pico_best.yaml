pico_ego_collector:
  recommended_coord_transform: raw
  recommended_apply_filter: false
  qpos_postprocess:
    distal_min_angle: 0.0
    smooth_window: 5
    max_frame_step: 0.12
  source_candidate: avp_bio_full2_raw_nofilter
  note: Default Pico->Wuji recommendation after visual MuJoCo inspection. It
    keeps raw/no-filter input, adds PIP/DIP biomechanical terms, clamps distal
    joint4 to non-negative angles, and smooths reacquisition jumps.
